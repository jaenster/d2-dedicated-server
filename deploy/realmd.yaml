# realmd on Kubernetes — the realm server (bnetd + MCP realm on one port), fronted
# by a LoadBalancer, with the game-server fleet in deploy/gs.yaml.
#
# State lives behind realmd's persistence facade — Postgres for the record, Redis for what is
# in flight. There is no third option:
#   fs     — a shared RWX volume (no extra services; set up the PVC below)
#   redis  — ephemeral sessions/games in Redis (this file deploys one)
#   pg     — durable character saves in Postgres (this file deploys one)
# The default below runs durable=pg (chars) + ephemeral=redis (sessions/games), so
# realmd pods are stateless protocol fronts and scale freely. Switch to fs by setting
# REALMD_STORE=fs and giving realmd the shared PVC instead.
#
#   kubectl apply -f deploy/realmd.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: realmd
---
# ── Postgres (durable: character saves) ──────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: realmd-pg
  namespace: realmd
stringData:
  POSTGRES_USER: realmd
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: realmd
  DSN: "postgres://realmd:change-me@realmd-pg:5432/realmd"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: realmd-pg
  namespace: realmd
spec:
  serviceName: realmd-pg
  replicas: 1
  selector:
    matchLabels: { app: realmd-pg }
  template:
    metadata:
      labels: { app: realmd-pg }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: realmd-pg }
          ports:
            - { containerPort: 5432, name: pg }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            # -h forces TCP. On the socket, initdb's temporary server answers while TCP is still
            # refused, so the pod goes Ready and every client of it fails on a closed connection.
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "realmd", "-d", "realmd"] }
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: realmd-pg
  namespace: realmd
spec:
  selector: { app: realmd-pg }
  ports:
    - { port: 5432, targetPort: 5432 }
---
# ── Redis (ephemeral: sessions + games, native TTL) ──────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realmd-redis
  namespace: realmd
spec:
  replicas: 1
  selector:
    matchLabels: { app: realmd-redis }
  template:
    metadata:
      labels: { app: realmd-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - { containerPort: 6379, name: redis }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: realmd-redis
  namespace: realmd
spec:
  selector: { app: realmd-redis }
  ports:
    - { port: 6379, targetPort: 6379 }
---
# ── realmd ───────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realmd
  namespace: realmd
spec:
  # Replicas are interchangeable. Nothing connects a realm server to a game server: servers
  # publish themselves into redis and take create/join from a queue there, so every pod sees the
  # whole fleet and can dispatch to all of it. Each pod needs its own REALMD_INSTANCE (below,
  # from metadata.name) — it seeds session ids and dispatch request ids, and two pods sharing one
  # would collect each other's replies.
  replicas: 2
  selector:
    matchLabels: { app: realmd }
  template:
    metadata:
      labels: { app: realmd }
    spec:
      terminationGracePeriodSeconds: 30   # room for the SIGTERM drain (see below)
      containers:
        - name: realmd
          image: realmd:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 6112, name: bnetd }
            - { containerPort: 8080, name: health }
          env:
            - name: REALMD_INSTANCE
              valueFrom:
                fieldRef: { fieldPath: metadata.name }   # unique per pod (session-id high bits)
            - name: REALMD_REALM_NAME
              value: "TypeGuru"
            # Public IPv4 clients dial for d2cs (bnetd advertises it). Set to the realm's
            # external LoadBalancer IP.
            - name: REALMD_REALM_ADDR
              value: "127.0.0.1"
            # Public IPv4 clients dial for GAME traffic — the d2ingress gateway. Required:
            # clients never reach a game server directly, since the token they present is
            # realm-global and only the gateway can translate it to the engine's game id.
            - name: REALMD_GAME_ADDR
              value: "127.0.0.1"
            # Persistence: durable chars in Postgres, ephemeral sessions/games in Redis.
            - name: REALMD_REDIS_ADDR
              value: "realmd-redis:6379"
            - name: REALMD_PG_DSN
              valueFrom:
                secretKeyRef: { name: realmd-pg, key: DSN }
            # Don't take client traffic until a game server has registered.
            - name: REALMD_REQUIRE_GS
              value: "1"
            - name: REALMD_LOG_JSON
              value: "1"
            - name: REALMD_SHUTDOWN_GRACE_MS
              value: "10000"
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: realmd
  namespace: realmd
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: { app: realmd }
  ports:
    - { port: 6112, targetPort: 6112, name: bnetd }
