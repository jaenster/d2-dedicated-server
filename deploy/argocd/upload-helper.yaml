# Throwaway pod to populate the d2-gamefiles PVC. Mounts the same RWX claim the GS pods
# read, so `kubectl cp` lands the proprietary 1.14d files into the volume. busybox has
# tar (kubectl cp needs it). Delete the pod once the copy is done.
#
#   kubectl -n realmd apply -f deploy/argocd/upload-helper.yaml
#   kubectl -n realmd cp ./testgame-min/. gamefiles-upload:/game/
#   kubectl -n realmd exec gamefiles-upload -- ls -la /game
#   kubectl -n realmd delete pod gamefiles-upload
apiVersion: v1
kind: Pod
metadata:
  name: gamefiles-upload
  namespace: realmd
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - { name: game, mountPath: /game }
  volumes:
    - name: game
      persistentVolumeClaim:
        claimName: d2-gamefiles
