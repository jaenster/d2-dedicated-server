# Default values for the `realm` chart — a headless Diablo II 1.14d realm server:
# realmd (protocol front) + a d2gs game-server fleet + the d2ingress gateway, backed
# by Postgres (durable character saves) and Redis (ephemeral sessions/games).
#
# These defaults are GENERIC and safe to publish: no real cluster IPs or passwords.
# At minimum you must set `realmAddr` (the public address clients dial) — game data
# is baked into the game-server image itself, so no manual data step is needed.

# Realm display name shown in the client realm list.
realmName: MyRealm

# Public IPv4 or hostname that clients dial for d2cs (bnetd advertises it). Set this to the
# realm's external LoadBalancer IP or a name pointing at it. REQUIRED — there is no sane default.
#
# A name is resolved ONCE, at realmd startup, because bnet hands the client four raw bytes and
# there is nowhere in the protocol to put a name. So DNS is how you write the address down, not
# how it fails over: moving the record needs a realmd restart to take effect. A floating IP that
# moves between nodes keeps working without one, which is why it is still the better front door.
#
# A name is resolved BY REALMD, so it must resolve the same inside the cluster as outside. Under
# split-horizon DNS it does not, and the failure is silent: a CoreDNS rewrite that points the
# cluster's own domains at the ingress Service hands realmd a ClusterIP, which it then advertises
# to every client on the internet. realmd stays healthy, the game servers stay registered, and
# nobody can log in. Check it before using a name, from a pod, not from your laptop:
#   kubectl run dns --rm -i --restart=Never --image=busybox -- nslookup <name>
# If that answers with anything but the public address, use the IP here.
realmAddr: ""

# Stable public IPs (e.g. cloud floating IPs) used as Service externalIPs on the public
# realmd and d2ingress Services. A floating IP fails over between nodes and gives the realm
# a fixed front door instead of an ephemeral LB IP. Empty = don't set externalIPs and fall
# back to a plain LoadBalancer (the cloud assigns an IP). Example:
#   floatingIPs: ["5.75.211.1", "78.47.225.57"]
floatingIPs: []

# REQUIRED. Public address realmd advertises to clients for GAME traffic — the d2ingress
# gateway, normally the first floatingIP (and defaulted to it when floatingIPs is set).
# realmd writes {token -> the real GS pod ip:port} to redis and hands the client this address
# plus the token; d2ingress looks the token up and splices through to the right GS, which stays
# internal. Clients never dial a game server: the token is realm-global and only the gateway
# can translate it, so realmd refuses to start without this. A hostname works, resolved once at
# startup on the same terms as realmAddr above.
gameAddr: ""

# Don't take client traffic until a game server has published itself into redis.
requireGS: true

# Auto-register an UNKNOWN account password-less on logon instead of rejecting it. Passwords on
# accounts that have one are verified either way. Convenience for a test realm; leave off otherwise.
permissiveAuth: false

# Per-component container images.
images:
  realmd:
    repository: ghcr.io/jaenster/realmd
    tag: latest
    pullPolicy: Always
  # Every game server is a tag on the ONE d2gs repository — the engine version is the tag, the
  # way it is for postgres. 1.14d serves via wine, 1.14d-native without it, and 1.06b … 1.13c
  # host the game's own DLLs; which one a tag uses is not something a values file has to know.
  gs:
    repository: ghcr.io/jaenster/d2gs
    # No tag here: the engine IS the tag, and a realm hosts several. Each entry in
    # `gameServer.engines` gets `<engine>` — or `<engine>-<release>` when `release` is set, which
    # is how a realm pins the build rather than following whatever last passed e2e.
    release: ""
    pullPolicy: Always
  d2ingress:
    repository: ghcr.io/jaenster/d2ingress
    tag: latest
    pullPolicy: Always
  gsNative:
    repository: ghcr.io/jaenster/d2gs
    tag: "1.14d-native"
    pullPolicy: Always

# ── realmd: the stateless protocol front (bnetd + MCP realm) ───────────────────────
realmd:
  # Replicas are interchangeable: game servers publish themselves into redis and take work
  # from a queue there, so every pod sees the whole fleet and can dispatch to all of it.
  # Each pod gets its own REALMD_INSTANCE from metadata.name, which is what keeps their
  # session ids and request ids in disjoint ranges — do not pin it to a fixed value.
  replicas: 2
  # RollingUpdate: a surged pod goes Ready as soon as it can see a published game server,
  # which does not depend on the old pod going away. (Recreate was needed only while a
  # game server held a control connection to exactly one pod.)
  recreate: false
  # GitOps rolls back via git, so keep only the active ReplicaSet (0 = no history).
  revisionHistoryLimit: 0
  # Drain window for the SIGTERM shutdown grace below.
  terminationGracePeriodSeconds: 30
  shutdownGraceMs: 10000
  # Anything a realm's own extensions need. The chart cannot know what they are — an extension is
  # compiled into a downstream binary and reads REALMD_EXT_<NAME>_<KEY> — so this is the seam that
  # lets a realm configure one without the chart learning about it.
  #
  # extraEnv is appended AFTER the settings above, so a realm can override any of them.
  #   extraEnv:
  #     - name: REALMD_EXT_LOGIN_PORT
  #       value: "7211"
  #     - name: REALMD_EXT_LOGIN_SECRET
  #       valueFrom:
  #         secretKeyRef: { name: my-secret, key: login-secret }
  extraEnv: []
  # For pulling a whole Secret or ConfigMap in at once.
  #   extraEnvFrom:
  #     - secretRef: { name: my-secret }
  extraEnvFrom: []
  # Ports an extension listens on. These get containerPorts AND a `realmd-internal` ClusterIP
  # Service — never the public `realmd` LoadBalancer, which is pinned to the realm's floating IPs.
  # An extension port is internal by construction: the login extension mints a ticket for any
  # account it is asked about, guarded by nothing but a bearer secret.
  #   extraPorts:
  #     - { containerPort: 7211, name: extlogin }
  extraPorts: []
  logJson: true
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# ── Postgres: durable character saves ──────────────────────────────────────────────
postgres:
  # Run a Postgres as part of this chart. It is one pod with one volume and no backups, which
  # is fine for trying the realm out and is not where characters should live for long. Turn it
  # off and set `external` below to use a database the cluster already runs — an operator-managed
  # cluster with failover and point-in-time recovery is the difference between losing a node and
  # losing everyone's characters.
  enabled: true

  # Where realmd's DSN comes from when `enabled` is false: a Secret you already have, which is
  # normally the one the Postgres operator generated. Naming the secret rather than the DSN keeps
  # the password out of your values file, and out of whatever git repo that lives in.
  external:
    # Secret holding the connection string. REQUIRED when postgres.enabled is false.
    secretName: ""
    # Key within it. CloudNativePG writes a ready-made `uri`; other operators differ.
    secretKey: uri
  image: postgres:16-alpine
  auth:
    username: realmd
    # Override this in production: --set postgres.auth.password=... or a values override.
    password: change-me
    database: realmd
  storage:
    size: 5Gi
    # Empty string uses the cluster default StorageClass.
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ── Redis: sessions, games, the fleet — and saves on their way to Postgres ─────────
redis:
  # Run a redis as part of this chart. It is one pod: a restart costs every session and every game,
  # and the volume below is what keeps it from also costing the saves that had not reached Postgres
  # yet. Turn it off and set `external.addr` to point at a replicated one instead.
  enabled: true

  # Where every component dials redis when `enabled` is false. host:port.
  #
  # Our clients speak plain RESP: one address, no AUTH, no Sentinel, no Cluster redirects. So this
  # has to be a single endpoint that always answers as a writable master — a Sentinel setup needs
  # something in front of it that follows the master, and Redis Cluster will not work at all.
  external:
    addr: ""

  image: redis:7-alpine

  # Sessions and games are disposable; a character save is not. It lands here first and a worker
  # moves it to Postgres afterwards, so a redis that comes back empty has silently thrown away
  # every save still inside that window. A small volume and an append-only log is what makes a
  # restart cost a reconnect instead of somebody's last hour.
  persistence:
    enabled: true
    size: 1Gi
    # Empty string uses the cluster default StorageClass.
    storageClass: ""

  # Keep redis under its own ceiling so it refuses writes instead of being OOM-killed with the
  # realm's live state in it. Set this below `resources.limits.memory` — the process needs room
  # above the dataset for buffers and the rewrite.
  maxmemory: 96mb
  # noeviction on purpose. Every other policy answers memory pressure by deleting a key, and the
  # keys here are sessions, live games and unflushed characters — losing one quietly is worse
  # than a write that fails loudly.
  maxmemoryPolicy: noeviction

  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# ── gameServer: the d2gs fleet (internal pod-IP only; d2ingress fronts game traffic) ──
gameServer:
  # Which engines this realm hosts. One Deployment per entry, each running the image built for
  # that engine, and the fleet is the union of them.
  #
  # Nothing routes by hand: a server publishes `v=<engine>` with itself, a character carries the
  # engine it was made for, and realmd only ever picks among the servers running it. So adding a
  # line here is the whole of adding an era to a realm — and REMOVING one strands every character
  # made for it, which will simply find no server rather than land on an engine that cannot read
  # its save.
  #
  # Each entry takes `version` plus any of `replicas`, `maxGames`, `tag`, `resources`,
  # `extraDlls`, `extraArgs`; anything it leaves out falls back to the values below.
  engines:
    - version: "1.14d"
  replicas: 1
  # Unset: the server advertises what it can actually host. Fog's pool allocator keeps 8 managers
  # and the Global Pool System holds one, so seven games is the engine's ceiling — and the server
  # raises its own figure if poolgrow gets it more. Setting a number here overrides both, including
  # upwards, which only produces games the realm dispatches and the engine cannot take.
  maxGames: ""
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  # The minimal data set rides in the image itself (see LEGAL.md and tools/make-minimal.sh),
  # so a bare `helm install` gets a working GS with no data step, no initContainer and nothing
  # for storage to replicate. Turn this on only to serve a DIFFERENT install — a full one, a
  # mod, or an era that matches a pre-1.14 engine tag — from an RWX volume mounted over /game.
  gameFiles:
    enabled: false
    # Populate it once before scaling up; it is mounted read-only into every GS pod.
    size: 256Mi
    # Empty string uses the cluster default StorageClass. Must support ReadWriteMany.
    storageClass: ""
  # Extra server-mod DLLs to --loaddll after d2gs.dll (space-separated; unix paths
  # under a mounted /mods are converted to Z:\ automatically). Empty by default.
  extraDlls: ""
  # Extra Game.exe flags — e.g. "-direct -txt" to load a loose /moddata data/ tree.
  extraArgs: ""

# ── gameServerNative: the wine-free GS, alongside the wine fleet above ─────────────
# Off by default: it runs the 1.14d Mac image in-process and is newer than the wine path, so a
# realm that enables it will have some games hosted by each. Its data is baked into the image, so
# there is no gameFiles override here.
gameServerNative:
  enabled: false
  replicas: 1
  # One game at a time. Concurrent games fault inside the engine's own CleanUpClient shortly after
  # a game empties (see apps/d2gs-native/realm.zig); the ceiling is 7 either way.
  maxGames: 1
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  # imagePullSecret name, only needed if you point images.gsNative at a private repository.
  pullSecret: ""

# ── d2ingress: token-translating game gateway (public on the FIPs when floatingIPs set) ─
d2ingress:
  enabled: true
  logJson: true
  # The d2ingress image is typically private (unlike the public realmd/d2gs). Set the
  # imagePullSecret name (e.g. the cluster-standard `ghcr` dockerconfigjson) to pull it.
  pullSecret: ""
  resources:
    requests: { cpu: 25m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }
