{{- if .Values.gameServer.gameFiles.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: d2-gamefiles
  labels:
    {{- include "realm.labels" . | nindent 4 }}
    app.kubernetes.io/component: gameserver
spec:
  # An OVERRIDE, not the normal path: the image already carries a minimal install. Populate this
  # once with the install you want served instead — a full one, a mod, or the era matching a
  # pre-1.14 engine tag — and it is mounted read-only over /game in every GS pod, so it must
  # support ReadWriteMany.
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: {{ .Values.gameServer.gameFiles.size | quote }}
  {{- if .Values.gameServer.gameFiles.storageClass }}
  storageClassName: {{ .Values.gameServer.gameFiles.storageClass | quote }}
  {{- end }}
{{- end }}
