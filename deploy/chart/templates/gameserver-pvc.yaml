{{- if not .Values.gameServer.dataImage.repository }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: d2-gamefiles
  labels:
    {{- include "realm.labels" . | nindent 4 }}
    app.kubernetes.io/component: gameserver
spec:
  # FALLBACK (only when gameServer.dataImage.repository is empty): populated once with a
  # real, proprietary D2 1.14d install; mounted read-only into every GS pod, so it must
  # support ReadWriteMany. The recommended path is dataImage (no persistent volume).
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: {{ .Values.gameServer.gameFiles.size | quote }}
  {{- if .Values.gameServer.gameFiles.storageClass }}
  storageClassName: {{ .Values.gameServer.gameFiles.storageClass | quote }}
  {{- end }}
{{- end }}
