apiVersion: v1
kind: Service
metadata:
  name: realmd
  labels:
    {{- include "realm.labels" . | nindent 4 }}
    app.kubernetes.io/component: realmd
spec:
  type: LoadBalancer
  {{- if .Values.floatingIPs }}
  # Front the realm on stable public floating IPs (they fail over between nodes).
  externalIPs:
    {{- range .Values.floatingIPs }}
    - {{ . | quote }}
    {{- end }}
  # A floating IP lands on ONE node, which usually won't be co-located with a realmd
  # replica; Cluster lets any node route the traffic to a realmd pod anywhere.
  externalTrafficPolicy: Cluster
  {{- else }}
  {{- end }}
  selector:
    {{- include "realm.selectorLabels" (dict "root" . "component" "realmd") | nindent 4 }}
  # One port. Game servers do not connect to realmd at all — they meet it in redis — so there
  # is no internal Service to pair with this one.
  ports:
    - { port: 6112, targetPort: 6112, name: bnetd }
