{{- if .Values.qqserver.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qqserver
  labels:
    {{- include "realm.labels" . | nindent 4 }}
    app.kubernetes.io/component: qqserver
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "realm.selectorLabels" (dict "root" . "component" "qqserver") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "realm.selectorLabels" (dict "root" . "component" "qqserver") | nindent 8 }}
    spec:
      containers:
        - name: qqserver
          image: "{{ .Values.images.qqserver.repository }}:{{ .Values.images.qqserver.tag }}"
          imagePullPolicy: {{ .Values.images.qqserver.pullPolicy }}
          ports:
            - { containerPort: 4000, name: game }
          env:
            - name: REALMD_BIND
              value: "0.0.0.0"
            - name: REALMD_QQ_PORT
              value: "4000"
            - name: REALMD_REDIS_ADDR
              value: "realmd-redis:6379"
            - name: REALMD_LOG_JSON
              value: {{ ternary "1" "0" .Values.qqserver.logJson | quote }}
          resources:
            {{- toYaml .Values.qqserver.resources | nindent 12 }}
{{- end }}
