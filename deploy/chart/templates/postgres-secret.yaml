{{- /*
realmd always reads its durable Postgres DSN from this secret (key: DSN), so the
secret is rendered whether or not the in-cluster Postgres is enabled. With postgres
disabled, point realmd at an external database by overriding postgres.auth.* (or
supply your own `realmd-pg` secret out of band).
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: realmd-pg
  labels:
    {{- include "realm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  DSN: {{ printf "postgres://%s:%s@realmd-pg:5432/%s" .Values.postgres.auth.username .Values.postgres.auth.password .Values.postgres.auth.database | quote }}
