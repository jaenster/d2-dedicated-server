{{- /*
The chart's own Postgres credentials. Rendered only when that Postgres exists: with
postgres.enabled false the DSN comes from postgres.external.secretName instead, and
rendering this too would put a second, wrong password next to the real one.
*/ -}}
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: realmd-pg
  labels:
    {{- include "realm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  DSN: {{ printf "postgres://%s:%s@realmd-pg:5432/%s" .Values.postgres.auth.username .Values.postgres.auth.password .Values.postgres.auth.database | quote }}
{{- end }}
