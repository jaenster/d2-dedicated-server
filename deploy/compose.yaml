# Local cloud-native stack — the same realmd image + backends as k8s, on one host.
#
#   docker compose -f deploy/compose.yaml up --build
#
# Brings up realmd (durable=Postgres for char saves, ephemeral=Redis for sessions+games)
# behind published ports, so a real 1.14d client (or the smoke tests) can hit it on
# localhost. The game server runs separately under wine (it needs the proprietary game
# files) — see the commented `gs` service / deploy/gs.yaml.
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: realmd
      POSTGRES_PASSWORD: realmd
      POSTGRES_DB: realmd
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "realmd"]
      interval: 3s
      retries: 10

  realmd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: realmd
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      REALMD_DURABLE_STORE: pg
      REALMD_EPHEMERAL_STORE: redis
      REALMD_DATA_DIR: /data
      REALMD_REDIS_ADDR: redis:6379
      REALMD_PG_DSN: postgres://realmd:realmd@postgres:5432/realmd
      REALMD_LOG_JSON: "1"
      # The address bnetd advertises to the client for d2cs. For a client on the host,
      # this must be reachable from the host — 127.0.0.1 works with the published ports.
      REALMD_REALM_ADDR: "127.0.0.1"
      # Game traffic goes through realmd's own edge rather than a separate d2ingress: one
      # host, one binary, no redis hop. Clients never dial the game server directly — the
      # token they carry is realm-global and only an edge can translate it.
      REALMD_GAME_PORT: "4000"
      REALMD_GAME_ADDR: "127.0.0.1"
    volumes:
      - realmd-data:/data
    ports:
      - "6112:6112"  # bnetd
      - "4000:4000"  # game traffic (the embedded edge; clients dial this)
      - "18080:8080" # health (8080 is often taken on the host)

  # The headless wine game server. It needs the proprietary D2 1.14d install, so it's
  # behind the `gs` profile (not started by a plain `up`). Point D2GS_GAME_SRC at your
  # install (a .env in the repo root works) and run: `docker compose --profile gs up`.
  gs:
    profiles: ["gs"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gs
    depends_on:
      realmd: { condition: service_started }
    environment:
      D2GS_REDIS_ADDR: "redis:6379"       # its only link to the realm — no realmd address at all
      D2GS_GS_ADDR: "127.0.0.1:4000"      # what host clients dial for game traffic
      D2GS_MAX_GAMES: "50"
    volumes:
      # Set D2GS_GAME_SRC to your D2 1.14d install dir (a repo-root .env works). If unset,
      # an empty dir is mounted and the entrypoint exits with "mount a D2 install at /game".
      - ${D2GS_GAME_SRC:-./.no-game-src-set}:/game:ro
      - gs-wine:/wine
      # Optional: drop server-mod DLLs in ./mods and extra data in ./moddata
      # - ./mods:/mods:ro
      # - ./moddata:/moddata:ro
    ports:
      - "4000:4000"

  # The wine-free GS. Unlike `gs` above, this one needs NO mounted install — the image bakes in
  # its own minimal 1.14d data (deploy/Dockerfile's gs-native target) — so it's behind its own
  # `native` profile rather than `gs`: no D2GS_GAME_SRC, no wine, no Xvfb. Useful for CI (see
  # .github/workflows/build.yml's `e2e` job) and for local dev on a box without wine.
  #
  # No published port: clients never dial a game server directly (see the "always crosses an
  # ingress" note above realmd) — only realmd's embedded edge (host 4000, published above) is
  # ever dialled. D2GS_GS_ADDR is this container's DNS name on the compose network, which is
  # what has to be reachable from realmd's container for the edge to splice to it; 127.0.0.1
  # (the default) would be gs-native's own loopback, unreachable from anywhere else.
  gs-native:
    profiles: ["native"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gs-native
    depends_on:
      realmd: { condition: service_started }
    environment:
      # NOT WIRED UP YET: the native server still speaks the retired control socket, so it does
      # not join a realm at all until it is ported to the store. It boots and serves nothing.
      D2GS_REDIS_ADDR: "redis:6379"
      D2GS_GS_ADDR: "gs-native:4000"

volumes:
  realmd-data:
  gs-wine:
