# d2gs game-server fleet on Kubernetes.
#
# The fleet is INTERNAL: clients never dial a game server. They reach d2ingress on the
# public :4000 carrying a realm-global token, and it splices to the owning GS by pod IP
# from the redis route. So a GS needs no client-routable address — it reports its own pod
# IP (downward API status.podIP) to realmd as D2GS_GS_ADDR.
#
# That is also why the fleet can exceed the node count: without a hostPort node-level bind
# there is nothing to collide, so anti-affinity is a preference (spread for fault
# tolerance) rather than a requirement.
#
# Each GS meets the realm in redis: it publishes itself there (self-reporting D2GS_GS_ADDR),
# takes create/join from its own queue, and reads and writes characters there. It never dials
# realmd, so the two scale independently.
#
# Game files are proprietary: populate the d2-gamefiles PVC with a real 1.14d install
# (ReadOnlyMany) before scaling up.
#
#   docker build -f deploy/Dockerfile --target gs -t d2gs:latest .
#   kubectl apply -f deploy/gs.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: d2-gamefiles
  namespace: realmd
spec:
  accessModes: ["ReadOnlyMany"]   # populated once with a real D2 1.14d install
  resources:
    requests:
      storage: 4Gi
  # storageClassName: longhorn
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: d2gs
  namespace: realmd
spec:
  serviceName: d2gs
  replicas: 2
  selector:
    matchLabels: { app: d2gs }
  template:
    metadata:
      labels: { app: d2gs }
    spec:
      # Spread replicas across nodes for fault tolerance, but do not require it: nothing
      # binds a node-level port, so several game servers can share a node.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: d2gs }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: d2gs
          image: d2gs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 4000, name: game }
          env:
            # The shared store — this GS's only link to the realm.
            - name: D2GS_REDIS_ADDR
              value: realmd-redis.realmd.svc.cluster.local:6379
            # Node IP → the public address clients dial for this pod's games.
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - name: D2GS_GS_ADDR
              value: "$(POD_IP):4000"
            - name: D2GS_MAX_GAMES
              value: "50"
            # Optional: extra server-mod DLLs to load after d2gs.dll (space-separated;
            # unix paths under a mounted /mods are converted to Z:\ automatically).
            # - name: D2GS_EXTRA_DLLS
            #   value: "/mods/mymod.dll"
            # Optional: extra Game.exe flags — e.g. load the loose /moddata data/ tree.
            # - name: D2GS_EXTRA_ARGS
            #   value: "-direct -txt"
          volumeMounts:
            - { name: game, mountPath: /game, readOnly: true }
            - { name: wine, mountPath: /wine }
            - { name: work, mountPath: /work }
            # Server-mod DLLs: each *.dll is --loaddll'd after d2gs.dll.
            # - { name: mods, mountPath: /mods, readOnly: true }
            # Extra data files (MPQs / loose data/ tree) overlaid onto the game dir.
            # - { name: moddata, mountPath: /moddata, readOnly: true }
      volumes:
        - name: game
          persistentVolumeClaim:
            claimName: d2-gamefiles
        - name: wine
          emptyDir: {}     # wine prefix re-inits per start; make it a PVC to persist
        - name: work
          emptyDir: {}
