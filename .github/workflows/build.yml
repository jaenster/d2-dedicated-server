# Builds the deploy images and pushes them to ghcr.io. GitHub runners are amd64, so
# everything builds natively (no QEMU) — including the wine `gs` image. The built-in
# GITHUB_TOKEN pushes to this account's ghcr packages.
#
#   ghcr.io/jaenster/realmd    — clean-room Zig realm server (scratch, static musl)
#   ghcr.io/jaenster/d2gs      — headless wine GS runtime (game files mounted at runtime)
#   ghcr.io/jaenster/qqserver  — token-translating game-traffic gateway (scratch, musl)
#
# The cluster pulls these anonymously (public packages) — flip a NEW package to public
# once under github.com/users/jaenster/packages. The PRIVATE d2gs-deploy repo's ArgoCD
# app rolls them out (imagePullPolicy: Always on :latest).
name: build
# Build images only when it matters, not on every commit/branch:
#  - push to main or a vN.N.N tag (the canonical/published images)
#  - ONLY when an image input actually changes (source/Dockerfile/entrypoint/webui) —
#    deploy manifests + the Helm chart don't affect images, so they don't trigger.
#  - manual (workflow_dispatch) for ad-hoc builds off any branch during dev.
# concurrency cancels superseded runs so rapid pushes don't pile up.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - apps/**
      - packages/**
      - webui/**
      - deploy/Dockerfile
      - deploy/gs-entrypoint.sh
      - build.zig
      - build.zig.zon
      - .github/workflows/build.yml
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one image failing (e.g. a new package's first push) must not cancel the others
      matrix:
        include:
          - target: realmd
            image: realmd
          - target: gs
            image: d2gs
          - target: qqserver
            image: qqserver
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          # `latest` follows main and the commit sha is the immutable handle a deploy pins; a
          # vN.N.N push additionally publishes that version, so a chart can name a release rather
          # than a hash. An empty line here is ignored, which is what the non-tag case produces.
          tags: |
            ghcr.io/jaenster/${{ matrix.image }}:latest
            ghcr.io/jaenster/${{ matrix.image }}:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/jaenster/{0}:{1}', matrix.image, github.ref_name) || '' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
