# Builds the two deploy images and pushes them to ghcr.io. GitHub runners are amd64,
# so both build natively (no QEMU) — including the wine `gs` image. The built-in
# GITHUB_TOKEN can push to this account's ghcr packages.
#
#   ghcr.io/jaenster/realmd  — clean-room Zig realm server (scratch, static musl)
#   ghcr.io/jaenster/d2gs    — headless wine GS runtime (game files mounted at runtime)
#
# Packages stay PRIVATE; the cluster pulls them with an imagePullSecret (see
# deploy/argocd/README.md). ArgoCD watches deploy/ and rolls out on a tag bump.
name: build
on:
  push:
    branches: [main, feat/realm-server-completeness]
    paths: [src/**, deploy/**, build.zig, build.zig.zon, .github/workflows/build.yml]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: realmd
            image: realmd
          - target: gs
            image: d2gs
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jaenster/${{ matrix.image }}:latest
            ghcr.io/jaenster/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
