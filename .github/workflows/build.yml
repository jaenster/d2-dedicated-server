# Builds the deploy images, runs the real-GS stress e2e against them, and only then promotes
# `:latest`. GitHub runners are amd64, so everything builds natively (no QEMU) — including the
# wine `gs` image. The built-in GITHUB_TOKEN pushes to this account's ghcr packages.
#
#   ghcr.io/jaenster/realmd    — clean-room Zig realm server (scratch, static musl)
#   ghcr.io/jaenster/d2gs      — headless wine GS runtime (game data supplied at runtime,
#                                 by default via the d2-gamedata initContainer below)
#   ghcr.io/jaenster/d2ingress — token-translating game-traffic gateway (scratch, musl)
#   ghcr.io/jaenster/d2gs-native — wine-free GS: the Mac 1.14d image loaded in-process,
#                                 minimal game data baked in (scratch)
#   ghcr.io/jaenster/d2-gamedata — the minimal 1.14d data set alone (windows), at /gamedata;
#                                 what deploy/chart's load-gamedata initContainer copies in.
#                                 Rebuilds only on a Dockerfile change or workflow_dispatch —
#                                 the source tarball lives outside this repo (files.typeguru.nl)
#                                 and isn't otherwise watched for updates.
#
# The cluster pulls these anonymously (public packages) — flip a NEW package to public once
# under github.com/users/jaenster/packages. The PRIVATE d2gs-deploy repo's ArgoCD app rolls out
# `:latest` (imagePullPolicy: Always), which `promote-latest` below is the only thing that moves.
name: build
# Build images only when it matters, not on every commit/branch:
#  - a PR against main (build + e2e only — see push: false below; nothing to publish yet)
#  - push to main or a vN.N.N tag (build + e2e, then promote-latest moves :latest)
#  - ONLY when an image input actually changes (source/Dockerfile/entrypoint/webui) —
#    deploy manifests + the Helm chart don't affect images, so they don't trigger.
#  - manual (workflow_dispatch) for ad-hoc builds off any branch during dev.
# concurrency cancels superseded runs so rapid pushes don't pile up.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &image-paths
      - apps/**
      - packages/**
      - webui/**
      - deploy/Dockerfile
      - deploy/gs-entrypoint.sh
      - build.zig
      - build.zig.zon
      # The test suites themselves: a change to what verifies the images has to run before it is
      # trusted, and tools/ is where both of them live.
      - tools/**
      - .github/workflows/build.yml
  pull_request:
    branches: [main]
    paths: *image-paths
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Every job here gets a cap. A hung step costs real money on a hosted runner, and the default
    # is six HOURS — one wedged test once cost 37 minutes before anyone noticed it was not slow.
    timeout-minutes: 25
    strategy:
      fail-fast: false   # one image failing (e.g. a new package's first push) must not cancel the others
      matrix:
        include:
          - target: realmd
            image: realmd
          - target: gs
            image: d2gs
          - target: d2ingress
            image: d2ingress
          # The wine-free GS: one static i386 ELF in scratch. The image claims linux/amd64 like
          # the rest — containerd matches an image's platform against the node's and refuses a
          # linux/386 image outright, while that same node's kernel runs the i386 binary.
          - target: gs-native
            image: d2gs-native
          - target: gamedata
            image: d2-gamedata
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        # A PR doesn't push, so a fork PR (read-only GITHUB_TOKEN, no packages:write) still builds.
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # No `:latest` here — the commit sha is the immutable handle this job publishes, and
          # `:latest` only moves once `promote-latest` confirms e2e passed on THIS sha. A vN.N.N
          # push additionally publishes that version. An empty line here is ignored, which is
          # what the non-tag case produces.
          tags: |
            ghcr.io/jaenster/${{ matrix.image }}:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/jaenster/{0}:{1}', matrix.image, github.ref_name) || '' }}

      # Hand the two images the e2e job runs to it, rather than have it build them again. It was
      # rebuilding both from cold — two minutes of a three-minute job, duplicating what this matrix
      # had already finished in parallel seconds earlier.
      #
      # A second buildx call rather than one build with two outputs: this one costs seconds because
      # the builder still holds the layers it just produced, and it keeps the publish path above
      # exactly as it was rather than rewriting it to emit a tarball as well.
      - name: hand the image to the e2e job
        if: matrix.target == 'realmd' || matrix.target == 'gs-native'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: e2e-${{ matrix.target }}:ci
      - name: save it
        if: matrix.target == 'realmd' || matrix.target == 'gs-native'
        run: docker save e2e-${{ matrix.target }}:ci -o /tmp/${{ matrix.target }}.tar
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'realmd' || matrix.target == 'gs-native'
        with:
          name: image-${{ matrix.target }}
          path: /tmp/${{ matrix.target }}.tar
          retention-days: 1

  # Unit tests + the clientless scenario suite. Runs on the runner rather than in an image: the
  # harness starts its own redis and postgres containers, which is far simpler from the host than
  # from inside one. Zig is fetched at the version deploy/Dockerfile pins, so this and the images
  # cannot drift onto different compilers.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZIG_VERSION: "0.16.0"
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          curl -sSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: unit tests
        run: zig build test
      # `zig build e2e` is NOT here yet, and deliberately. It passes on macOS and wedges on Linux:
      # d2ingress_token_translate reaches "route client_token=N -> GS 127.0.0.1:P [connecting]" and
      # never returns, which cost 37 minutes of runner time before it was cancelled. Running it
      # here again before that is understood would spend the same again on every push. Until then
      # it stays a local gate, and `zig build stress-e2e` (the e2e job below) is the real-server
      # coverage CI does have.

  # Real-GS stress e2e (tools/stress-e2e — a round loop in Zig against a real
  # GS instead of a bash + subprocess fleet — see that tool's doc comment). The test client runs
  # AS A CONTAINER on the same compose network as realmd/gs-native (deploy/compose.e2e.yaml),
  # dialling them by service name — no published host ports, no host-side wait loop (the binary's
  # own --wait-ms probe handles readiness). Builds its own images straight from the working tree
  # via compose rather than pulling what `build` just pushed: simpler than threading registry
  # auth / sha-pinned image refs through compose for a job that already needs `build` to have
  # succeeded first, at the cost of one extra compile. gs-native, not the wine `gs`, is the CI
  # target: it bakes its own game data in and needs no wine/Xvfb on the runner.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f deploy/compose.yaml -f deploy/compose.e2e.yaml --profile native
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: take the images the build jobs made
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: /tmp/images
      - name: load them
        run: |
          docker load -i /tmp/images/realmd.tar
          docker load -i /tmp/images/gs-native.tar
      # Only the test client, which nothing else builds. realmd and gs-native came in above, and
      # compose is told their image names in compose.e2e.yaml so it uses them instead of building.
      - name: build the test client
        run: $COMPOSE build stress-e2e
      # --no-build: the images came from the build jobs and must be used as they are. Without it a
      # name compose cannot find is quietly built instead, which is the duplicate work returning by
      # the back door and looking like a slow day.
      - name: bring up realmd + gs-native
        run: $COMPOSE up -d --no-build redis postgres realmd gs-native
      - name: stress e2e
        # ONE client, two games per login. Not a throughput choice: the native server admits about
        # half a round's games when several are wanted at once and refuses the rest cleanly (see
        # docs/STATUS.md), so two concurrent clients fail here for a reason that has nothing to do
        # with the change under test. One client still walks the whole loop — login, create, play,
        # leave, create again — which is the part that carries state worth doubting.
        run: |
          $COMPOSE run --rm stress-e2e --host realmd --rounds 5 --clients 1 --runs 2 \
            --account tester:tester --chars EpicSorc:1
      - name: check the servers' own logs agree with what the client saw
        # The stress-e2e result only proves the CLIENT's view; REALMD_LOG_JSON (set in
        # compose.e2e.yaml) gives realmd's own structured account of the same run to cross-check
        # against. Not byte-exact — loose presence/absence checks, not fixed counts, since a
        # retried CREATEGAME or a probe game is normal and not a failure.
        if: always()
        run: |
          $COMPOSE logs --no-log-prefix realmd    > /tmp/realmd.log    2>&1 || true
          $COMPOSE logs --no-log-prefix gs-native  > /tmp/gs-native.log 2>&1 || true
          fatal=$(jq -Rc 'fromjson? | select(.msg? // "" | test("FATAL|panic"; "i"))' /tmp/realmd.log /tmp/gs-native.log)
          if [ -n "$fatal" ]; then echo "$fatal"; echo "FATAL/panic in a server log"; exit 1; fi
          registered=$(jq -Rc 'fromjson? | select(.tag=="fleet" and (.msg | test("game server .* started")))' /tmp/realmd.log | wc -l)
          logons_ok=$(jq -Rc 'fromjson? | select(.msg | test("char logon .* -> ok"))' /tmp/realmd.log | wc -l)
          games_ok=$(jq -Rc 'fromjson? | select(.msg | test("create game .* -> gameid="))' /tmp/realmd.log | wc -l)
          echo "realmd logged: gs registrations=$registered, successful char logons=$logons_ok, games created=$games_ok"
          [ "$registered" -ge 1 ] || { echo "no game server ever published itself into redis"; exit 1; }
          [ "$logons_ok"  -ge 1 ] || { echo "realmd never logged a successful char logon"; exit 1; }
          [ "$games_ok"   -ge 1 ] || { echo "realmd never logged a successful game create"; exit 1; }
      - name: tear down
        if: always()
        run: $COMPOSE down -v

  # Moves `:latest` to the sha `build` just pushed — a manifest copy, no rebuild. Only after e2e
  # passes, and only on a real push to main (never a PR: there's nothing to promote yet).
  promote-latest:
    needs: [build, test, e2e]
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [realmd, d2gs, d2ingress, d2gs-native, d2-gamedata]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            -t ghcr.io/jaenster/${{ matrix.image }}:latest \
            ghcr.io/jaenster/${{ matrix.image }}:${{ github.sha }}
