# Builds the deploy images, runs the real-GS stress e2e against them, and only then promotes the
# floating tags. GitHub runners are amd64, so everything builds natively (no QEMU) — including the
# wine images. The built-in GITHUB_TOKEN pushes to this account's ghcr packages.
#
#   ghcr.io/jaenster/realmd    — clean-room Zig realm server (scratch, static musl)
#   ghcr.io/jaenster/d2ingress — token-translating game-traffic gateway (scratch, musl)
#   ghcr.io/jaenster/d2gs      — EVERY game server, one tag per engine: 1.06b … 1.13c host the
#                                 game's own D2Game.dll, 1.14d injects into Game.exe, and
#                                 1.14d-native drops wine. Which mechanism serves a given engine
#                                 is our problem, not the consumer's — they pick a version, the
#                                 way postgres:16 picks a version. Minimal game data is baked in.
#
# There used to be a package per mechanism (d2gs-native) and one for the data alone (d2-gamedata).
# Both are gone: a variant of the game server is a TAG on the game server, not a separate product,
# and 16 MB of data that never changes independently of the server reading it does not need its own
# release train. Nothing publishes to those two names any more.
#
# The cluster pulls these anonymously (public packages) — flip a NEW package to public once
# under github.com/users/jaenster/packages. The PRIVATE d2gs-deploy repo's ArgoCD app rolls out
# the floating tags (imagePullPolicy: Always), which `promote` below is the only thing that moves.
name: build
# Build images only when it matters, not on every commit/branch:
#  - a PR against main (build + e2e only — see push: false below; nothing to publish yet)
#  - push to main or a vN.N.N tag (build + e2e, then promote moves the floating tags)
#  - ONLY when an image input actually changes (source/Dockerfile/entrypoint/webui) —
#    deploy manifests + the Helm chart don't affect images, so they don't trigger.
#  - manual (workflow_dispatch) for ad-hoc builds off any branch during dev.
# concurrency cancels superseded runs so rapid pushes don't pile up.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &image-paths
      - apps/**
      - packages/**
      - webui/**
      - deploy/Dockerfile
      - deploy/build-d2host.sh
      - deploy/gs-entrypoint.sh
      - deploy/d2host-entrypoint.sh
      - build.zig
      - build.zig.zon
      # The test suites themselves: a change to what verifies the images has to run before it is
      # trusted, and tools/ is where both of them live.
      - tools/**
      - .github/workflows/build.yml
  pull_request:
    branches: [main]
    # `labeled` is NOT one of the default types, and without it adding the label below raises no
    # event at all — which is the entire mechanism.
    types: [opened, reopened, synchronize, labeled]
    paths: *image-paths
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Every job here gets a cap. A hung step costs real money on a hosted runner, and the default
    # is six HOURS — one wedged test once cost 37 minutes before anyone noticed it was not slow.
    timeout-minutes: 25
    strategy:
      fail-fast: false   # one image failing (e.g. a new package's first push) must not cancel the others
      matrix:
        include:
          - target: realmd
            image: realmd
          - target: d2ingress
            image: d2ingress
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        # A PR doesn't push, so a fork PR (read-only GITHUB_TOKEN, no packages:write) still builds.
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same string the engines job builds its tags from. Actions expressions cannot strip a
      # prefix — there is no substring() — so it is done here, once, rather than spelled two ways.
      - name: work out the release version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release=" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # No `:latest` here — the commit sha is the immutable handle this job publishes, and
          # `:latest` only moves once `promote` confirms e2e passed on THIS sha. A vN.N.N
          # push additionally publishes that version. An empty line here is ignored, which is
          # what the non-tag case produces.
          #
          # The version is the tag WITHOUT its `v`, because that is what the engines job stamps.
          # A release that publishes d2gs:1.10f-0.3.0 alongside realmd:v0.3.0 spells its own
          # version two ways, and a deployment pinning both gets exactly one of them wrong.
          tags: |
            ghcr.io/jaenster/${{ matrix.image }}:${{ github.sha }}
            ${{ steps.ver.outputs.release && format('ghcr.io/jaenster/{0}:{1}', matrix.image, steps.ver.outputs.release) || '' }}

      # Hand the realmd image the e2e job runs to it, rather than have it build one again. It was
      # rebuilding from cold — two minutes of a three-minute job, duplicating what this matrix had
      # already finished in parallel seconds earlier.
      #
      # A second buildx call rather than one build with two outputs: this one costs seconds because
      # the builder still holds the layers it just produced, and it keeps the publish path above
      # exactly as it was rather than rewriting it to emit a tarball as well.
      - name: hand the image to the e2e job
        if: matrix.target == 'realmd'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: e2e-realmd:ci
      - name: save it
        if: matrix.target == 'realmd'
        run: docker save e2e-realmd:ci -o /tmp/realmd.tar
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'realmd'
        with:
          name: image-realmd
          path: /tmp/realmd.tar
          retention-days: 1

  # Every engine, in ONE job, driven by deploy/build-d2host.sh.
  #
  # One job rather than a matrix of nine, deliberately. The versions share a ~750 MB debian + wine
  # layer and a zig cache; built in sequence on one runner they are paid for once and the engines
  # after the first cost a couple of megabytes and a compile each. A matrix would build that same
  # wine layer nine times on nine cold runners — faster on the wall clock, roughly twice the
  # runner-minutes, for images that are byte-identical below the top three layers anyway.
  #
  # The script decides which engines exist, because the readiness gate is a compile error: an
  # unfinished version cannot produce a binary, so it is refused and the rest carry on. A list of
  # version strings in this file would be a second source of truth that goes stale the day a
  # version becomes ready.
  engines:
    # On a pull request, only when it carries the `run-e2e` label. Building every engine image is
    # the single most expensive thing here (7-10 minutes) and on a PR it cannot even push what it
    # built, so per commit it buys a compile check that `test` already gives in under a minute.
    #
    # A label rather than a `/e2e` comment, and the difference is not ergonomics. A `labeled` event
    # carries the pull request, so the run happens on the HEAD COMMIT and reports a real check run
    # against it — which is what lets `engine-e2e` be a required check at all. `issue_comment`
    # fires against the default branch with no head SHA attached, so that route has to check out
    # the PR by hand and POST a commit status to make the gate notice it.
    #
    # (A merge queue would be better still — one run, on the commit about to land. It is org-only,
    # and this repo is user-owned, so the API refuses the rule outright.)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build every ready engine
        id: build
        env:
          D2GS_IMAGE_REPO: ghcr.io/jaenster/d2gs
          # The floating d2gs:<engine> means "the build that passed e2e", so this job must not
          # move it — `promote` does, and only after the e2e job is green.
          D2GS_TAG_FLOATING: "0"
          D2GS_PUSH: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          D2GS_BUILT_FILE: /tmp/engines.txt
        # On a vN.N.N tag the release number is the headline suffix and the sha rides along; off a
        # tag the sha is all there is to say. Either way every engine gets an immutable
        # <engine>-<sha> handle for `promote` to copy from.
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            app="${GITHUB_REF_NAME#v}"
            export D2GS_TAG_EXTRA="$GITHUB_SHA"
          else
            app="$GITHUB_SHA"
          fi
          deploy/build-d2host.sh "$app"
          echo "built=$(cat /tmp/engines.txt)" >> "$GITHUB_OUTPUT"
      # gs-native is the engine the e2e job drives (it bakes its data in and needs no wine or Xvfb
      # on the runner). Seconds, not a rebuild: the builder still holds every layer.
      - name: hand 1.14d-native to the e2e job
        run: |
          docker build -f deploy/Dockerfile --target gs-native --load -t e2e-gs-native:ci .
          docker save e2e-gs-native:ci -o /tmp/gs-native.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-gs-native
          path: /tmp/gs-native.tar
          retention-days: 1

  # Unit tests + the clientless scenario suite. Runs on the runner rather than in an image: the
  # harness starts its own redis and postgres containers, which is far simpler from the host than
  # from inside one. Zig is fetched at the version deploy/Dockerfile pins, so this and the images
  # cannot drift onto different compilers.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZIG_VERSION: "0.16.0"
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          # Retried for the same reason deploy/Dockerfile retries it: one dropped connection to
          # ziglang.org is not a broken build. --fail keeps an error page out of tar.
          curl -sSL --fail --retry 5 --retry-delay 3 --retry-all-errors \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: unit tests
        # Through the same retrying wrapper the images use: this job fetches the dependency tree
        # over the network too, and a dependency host having a bad day was failing it as though a
        # test had broken.
        run: deploy/zigbuild.sh test
      # `zig build e2e` is NOT here yet, and deliberately. It passes on macOS and wedges on Linux:
      # d2ingress_token_translate reaches "route client_token=N -> GS 127.0.0.1:P [connecting]" and
      # never returns, which cost 37 minutes of runner time before it was cancelled. Running it
      # here again before that is understood would spend the same again on every push. Until then
      # it stays a local gate, and `zig build stress-e2e` (the e2e job below) is the real-server
      # coverage CI does have.

  # Real-GS stress e2e (tools/stress-e2e — a round loop in Zig against a real
  # GS instead of a bash + subprocess fleet — see that tool's doc comment). The test client runs
  # AS A CONTAINER on the same compose network as realmd/gs-native (deploy/compose.e2e.yaml),
  # dialling them by service name — no published host ports, no host-side wait loop (the binary's
  # own --wait-ms probe handles readiness). Builds its own test-client image straight from the
  # working tree via compose rather than pulling what the build jobs just pushed: simpler than
  # threading registry auth / sha-pinned image refs through compose, at the cost of one compile.
  # 1.14d-native, not the wine engines, is the CI target: it bakes its own game data in and needs
  # no wine/Xvfb on the runner.
  e2e:
    needs: [build, engines]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f deploy/compose.yaml -f deploy/compose.e2e.yaml --profile native
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: take the images the build jobs made
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: /tmp/images
      - name: load them
        run: |
          docker load -i /tmp/images/realmd.tar
          docker load -i /tmp/images/gs-native.tar
      # Only the test client, which nothing else builds. realmd and gs-native came in above, and
      # compose is told their image names in compose.e2e.yaml so it uses them instead of building.
      - name: build the test client
        run: $COMPOSE build stress-e2e
      # --no-build: the images came from the build jobs and must be used as they are. Without it a
      # name compose cannot find is quietly built instead, which is the duplicate work returning by
      # the back door and looking like a slow day.
      - name: bring up realmd + gs-native
        run: $COMPOSE up -d --no-build redis postgres realmd gs-native
      - name: stress e2e
        # ONE client, two games per login. Not a throughput choice: the native server admits about
        # half a round's games when several are wanted at once and refuses the rest cleanly (see
        # docs/STATUS.md), so two concurrent clients fail here for a reason that has nothing to do
        # with the change under test. One client still walks the whole loop — login, create, play,
        # leave, create again — which is the part that carries state worth doubting.
        run: |
          $COMPOSE run --rm stress-e2e --host realmd --rounds 5 --clients 1 --runs 2 \
            --account tester:tester --chars EpicSorc:1
      - name: check the servers' own logs agree with what the client saw
        # The stress-e2e result only proves the CLIENT's view; REALMD_LOG_JSON (set in
        # compose.e2e.yaml) gives realmd's own structured account of the same run to cross-check
        # against. Not byte-exact — loose presence/absence checks, not fixed counts, since a
        # retried CREATEGAME or a probe game is normal and not a failure.
        if: always()
        run: |
          $COMPOSE logs --no-log-prefix realmd    > /tmp/realmd.log    2>&1 || true
          $COMPOSE logs --no-log-prefix gs-native  > /tmp/gs-native.log 2>&1 || true
          fatal=$(jq -Rc 'fromjson? | select(.msg? // "" | test("FATAL|panic"; "i"))' /tmp/realmd.log /tmp/gs-native.log)
          if [ -n "$fatal" ]; then echo "$fatal"; echo "FATAL/panic in a server log"; exit 1; fi
          registered=$(jq -Rc 'fromjson? | select(.tag=="fleet" and (.msg | test("game server .* started")))' /tmp/realmd.log | wc -l)
          logons_ok=$(jq -Rc 'fromjson? | select(.msg | test("char logon .* -> ok"))' /tmp/realmd.log | wc -l)
          games_ok=$(jq -Rc 'fromjson? | select(.msg | test("create game .* -> gameid="))' /tmp/realmd.log | wc -l)
          echo "realmd logged: gs registrations=$registered, successful char logons=$logons_ok, games created=$games_ok"
          [ "$registered" -ge 1 ] || { echo "no game server ever published itself into redis"; exit 1; }
          [ "$logons_ok"  -ge 1 ] || { echo "realmd never logged a successful char logon"; exit 1; }
          [ "$games_ok"   -ge 1 ] || { echo "realmd never logged a successful game create"; exit 1; }
      - name: tear down
        if: always()
        run: $COMPOSE down -v

  # The matrix comes from deploy/e2e-engines.txt so there is ONE list of engines and one statement
  # of what each is expected to manage. Adding an engine, or promoting one from `boot` to `world`,
  # is a line in that file and nothing here.
  # Every pre-1.14 engine, driven to a real world by the clientless — on the runner, not in
  # containers.
  #
  # It used to build nine engine images and run one compose stack per engine, which meant it could
  # only run AFTER those images were pushed, so it never guarded a pull request — the one place a
  # regression is cheap to fix. The runner is already a Linux VM: the only things that genuinely
  # want a container here are postgres and redis, and the harness starts those itself.
  #
  # No matrix. The engines run one at a time on purpose — they are wine processes and two racing
  # for a port fail in ways that read as protocol bugs — so a matrix would buy parallelism the test
  # cannot use, at the price of nine wine installs.
  engine-e2e-run:
    # Seven wine engines, one at a time, six minutes. Label-gated exactly like `engines` above —
    # add `run-e2e` when the branch is ready and it runs on that commit.
    #
    # The REQUIRED check is `engine-e2e` at the bottom of this file, not this job. Skipping is why:
    # see the comment there.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZIG_VERSION: "0.16.0"
      D2_MINIMAL_ENGINE_BASE: https://files.typeguru.nl/diablo/minimal
      CLIENTLESS: ${{ github.workspace }}/d2-clientless/zig-out/bin/clientless
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          # Retried for the same reason deploy/Dockerfile retries it: one dropped connection to
          # ziglang.org is not a broken build. --fail keeps an error page out of tar.
          curl -sSL --fail --retry 5 --retry-delay 3 --retry-all-errors \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      # Same recipe the engine image uses. i386 first: the engines are 32-bit and wine32 is what
      # actually runs them.
      - name: install wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine wine32 \
            || sudo apt-get install -y --no-install-recommends wine wine32:i386
          wine --version
      - name: build the clientless
        run: |
          git clone --depth 1 https://github.com/jaenster/d2-clientless.git
          cd d2-clientless && zig build -Doptimize=ReleaseSafe
      # The published tree per engine, named by the rows in deploy/e2e-engines.txt so this cannot
      # drift from what the run actually tests.
      - name: fetch the engine trees
        run: |
          mkdir -p .stack
          while read -r eng _; do
            case "$eng" in ''|\#*) continue ;; esac
            tag="${eng//./}"
            url="$D2_MINIMAL_ENGINE_BASE/$eng/d2-$eng-minimal.tgz"
            echo "==> $eng <- $url"
            mkdir -p ".stack/gs$tag"
            curl -fsSL "$url" | tar -xz -C ".stack/gs$tag" || { echo "no published tree for $eng"; exit 1; }
          done < deploy/e2e-engines.txt
      - name: bring up the realm
        run: ./run-stack.sh --realm-only
      - name: every engine to a world
        run: tools/e2e-engines.sh
      - name: server logs
        if: always()
        run: for f in .stack/*.log; do echo "===== $f ====="; tail -60 "$f"; done

  promote:
    needs: [build, engines, test, e2e, engine-e2e-run]
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: realmd + d2ingress -> :latest
        run: |
          for image in realmd d2ingress; do
            docker buildx imagetools create \
              -t "ghcr.io/jaenster/$image:latest" \
              "ghcr.io/jaenster/$image:${{ github.sha }}"
          done
      - name: each engine -> its floating tag
        run: |
          for engine in ${{ needs.engines.outputs.built }}; do
            docker buildx imagetools create \
              -t "ghcr.io/jaenster/d2gs:$engine" \
              "ghcr.io/jaenster/d2gs:$engine-${{ github.sha }}"
          done
          docker buildx imagetools create \
            -t ghcr.io/jaenster/d2gs:latest \
            "ghcr.io/jaenster/d2gs:1.14d-${{ github.sha }}"

  # The required status check, and the only one that speaks for the whole expensive half of this
  # workflow. Seconds to run.
  #
  # It exists because a SKIPPED required check counts as PASSING on GitHub. Gating the real jobs
  # with `if:` alone therefore saves the minutes AND quietly removes the gate: the pull request
  # goes green with `engine-e2e: SKIPPED`, `mergeStateStatus: CLEAN`, and nothing having run.
  # Measured on this repo, not assumed. So the check that main requires has to be a job that
  # always runs and reads the others' results.
  engine-e2e:
    needs: [engines, e2e, engine-e2e-run]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: the seven-engine gate must have run, and passed
        env:
          ENGINES: ${{ needs.engines.result }}
          E2E: ${{ needs.e2e.result }}
          ENGINE_E2E: ${{ needs.engine-e2e-run.result }}
        run: |
          echo "engines=$ENGINES  e2e=$E2E  engine-e2e-run=$ENGINE_E2E"
          if [ "$ENGINES" = success ] && [ "$E2E" = success ] && [ "$ENGINE_E2E" = success ]; then
            echo "the full gate ran on this commit and passed"
            exit 0
          fi
          if [ "$ENGINE_E2E" = skipped ]; then
            echo "::error::the seven-engine gate has not run on this commit. Add the 'run-e2e' label to the pull request to run it."
          else
            echo "::error::the seven-engine gate did not pass — engines=$ENGINES e2e=$E2E engine-e2e-run=$ENGINE_E2E"
          fi
          exit 1
